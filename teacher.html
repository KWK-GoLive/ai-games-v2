<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>Teacher view: all 4 boards · AI games</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230070C0'/%3E%3Cpath d='M9 8h14v4a7 7 0 0 1-14 0z M16 19v4 M11 25h10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="shared/arena.css">
  <link rel="stylesheet" href="shared/theme-chula.css">
  <style>
    /* one screen, four boards: sized for a projector (1280-1920 px wide); one column on narrow screens */
    body { overflow-x: hidden; }
    .tv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .tv-top form { display: flex; gap: 8px; align-items: center; }
    .tv-top .text-input { width: 9em; }
    /* the 4 boards fill exactly the screen under the top bar (--top is set by teacher.js); each scrolls inside */
    main.tv { max-width: none; margin: 0; padding: 10px 14px; height: calc(100vh - var(--top, 64px)); display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
    main.tv > .feedback:empty { display: none; }
    main.tv > .feedback { margin: 0; }
    .tv-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .tv-board { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); min-height: 0; overflow: hidden; }
    .tv-head { display: flex; align-items: baseline; gap: 10px; padding: 5px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
    .tv-head h2 { margin: 0; font-size: 1.1rem; }
    .tv-head .muted { font-size: .85rem; }
    .tv-head .open { margin-left: auto; font-size: .85rem; }
    .tv-body { overflow-y: auto; flex: 1; min-height: 0; }
    /* compact one-line rows; two columns inside a board when the class is big (set by teacher.js) */
    .tv-list { column-gap: 14px; padding: 2px 8px 6px; }
    .tv-list.two { column-count: 2; column-rule: 1px solid var(--line); }
    .tv-row { display: grid; grid-template-columns: 1.9em minmax(0, 1fr) 86px 5.6em 3.4em; gap: 6px; align-items: center;
      padding: 1px 0; border-bottom: 1px solid var(--line); break-inside: avoid; font-size: .86rem; line-height: 1.2; }
    .tv-row .rank { font-weight: 800; color: var(--ink-3); text-align: right; }
    .tv-row.top1 .rank { color: #b8860b; }
    .tv-nick { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-nick small { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
    .tv-row .pts { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .segs { display: flex; gap: 2px; height: 10px; }
    .segs span { flex: 1; border-radius: 2px; background: var(--bar-track, #e6e9f2); position: relative; overflow: hidden; }
    .segs span.done { background: var(--good); }
    .segs span.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
    .segs span.cur i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
    .segs span.lesson { background: repeating-linear-gradient(45deg, #c3dcf1 0 3px, #e9f2fa 3px 6px); outline: 2px solid var(--accent); outline-offset: -2px; }
    .pos { font-size: .8rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos.fin { color: var(--good); font-weight: 700; }
    .tv-row.idle > * { opacity: .5; }
    .tv-empty { padding: 14px; color: var(--ink-3); }
    .legend { font-size: .78rem; color: var(--ink-3); }
    /* two columns: the nickname matters most, so the bar and the texts get narrower (team shown in the tooltip) */
    .tv-list.two .tv-row { grid-template-columns: 1.6em minmax(0, 1fr) 50px 4.4em 3em; gap: 5px; }
    .tv-list.two .tv-nick small { display: none; }
    .tv-list.two .pos { font-size: .74rem; }
    @media (max-width: 1499px) { .legend { display: none; } }
    html.projector .tv-row { font-size: 1.1rem; grid-template-columns: 2em minmax(0, 1fr) 96px 6.4em 3.8em; }
    html.projector .pos { font-size: .95rem; }
    html.projector .tv-list.two .tv-row { grid-template-columns: 1.7em minmax(0, 1fr) 54px 4.6em 3.3em; }
    html.projector .tv-list.two .pos { font-size: .82rem; }
    html.projector .tv-head h2 { font-size: 1.35rem; }
    @media (max-width: 900px) {   /* phones and small tablets: one column, the page scrolls */
      main.tv { height: auto; }
      .tv-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
      .tv-board { max-height: 70vh; }
    }
  </style>
</head>
<body>
  <header class="topbar tv-top">
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit" title="▶ answered/items in the stage being played · 📖 reading the lesson · faded = no answer for 5 minutes. Bars: one segment per stage (finals: per item).">AI <span>games</span> · teacher view</a>
    <form id="cf"><label for="cc" class="small muted">Class</label><input class="text-input" id="cc" maxlength="20" autocomplete="off"><button class="btn primary" type="submit">Show</button></form>
    <span class="spacer"></span>
    <span class="legend" title="Progress bar: one segment per stage (finals: one per item). Green = finished, blue fill = items answered in the stage being played, stripes = reading the lesson.">▶ answered/items · 📖 lesson · faded = no answer for 5 min</span>
    <button class="btn ghost" id="big" type="button">Big text</button>
    <a class="btn ghost" id="single" href="board.html" title="One board with every stage column and the Part A/B views">Single board</a>
    <span class="pill" id="updated"></span>
  </header>
  <main id="app" class="tv">
    <noscript><div class="card">The teacher view needs JavaScript switched on.</div></noscript>
  </main>
  <script src="config.js"></script>
  <script src="shared/arena.js"></script>
  <script src="shared/teacher.js"></script>
</body>
</html>
